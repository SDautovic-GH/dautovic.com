<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff" id="meta-theme-color">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Article — Dautovic</title>
  <link rel="icon" href="/assets/img/logo.jpg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <!-- Ambient Scroll Reading Progress Bar -->
  <div id="reading-progress" aria-hidden="true"></div>

  <!-- Top Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-group">
        <a href="/" style="display:flex;align-items:center;gap:12px;">
          <img src="/assets/img/logo.jpg" alt="Dautovic Logo" class="brand-logo">
          <div class="brand-text">
            <h1>Dautovic</h1>
            <span class="brand-tagline">Learn every day.</span>
          </div>
        </a>
      </div>

      <nav class="site-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/archive.html" class="nav-link">Archive</a>
        <a href="/links.html" class="nav-link">Links</a>
        <a href="/page.html?slug=about" class="nav-link">About</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Article Container -->
  <main class="container" style="padding-top:20px;padding-bottom:60px;">
    <a href="/" class="back-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to all stories</span>
    </a>

    <div id="article-loader" style="text-align:center;padding:60px 0;color:var(--text-muted);">
      Loading article…
    </div>

    <article id="article-content" style="display:none;">
      <header class="article-header">
        <div class="article-pre-meta">
          <span id="post-cat" class="card-cat"></span>
          <span class="meta-dot">•</span>
          <span id="post-readtime" class="card-readtime"></span>
        </div>
        <h1 id="post-title" class="article-title"></h1>
        <div class="article-meta">
          <div class="article-meta-info">
            <span class="article-author">Samir Dautovic</span>
            <span class="meta-dot">•</span>
            <time id="post-date"></time>
          </div>
          <button id="share-btn" class="share-btn" aria-label="Share story">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
            <span>Share</span>
          </button>
        </div>
      </header>

      <div id="post-body" class="article-body"></div>

      <!-- Continuity: Next / Previous Article Cards -->
      <div id="post-nav-grid" class="post-nav-grid">
        <a id="prev-story-link" class="post-nav-card" style="display:none;">
          <span class="post-nav-dir">← Previous Story</span>
          <span id="prev-story-title" class="post-nav-title"></span>
        </a>
        <a id="next-story-link" class="post-nav-card" style="display:none;text-align:right;">
          <span class="post-nav-dir">Next Story →</span>
          <span id="next-story-title" class="post-nav-title"></span>
        </a>
      </div>

      <div style="margin-top:40px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;">
        <a href="/" class="read-link">← More articles</a>
        <a href="#top" class="read-link" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
      </div>
    </article>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast-notification" aria-live="polite">Link copied to clipboard ✓</div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/archive.html">Archive</a>
        <a href="/links.html">Links</a>
        <a href="/page.html?slug=about">About</a>
        <a href="/contact.html">Contact</a>
      </div>
      <p>© 2026 Samir Dautovic. Built on Cloudflare Pages.</p>
    </div>
  </footer>

  <script>
    // Theme toggle & sync
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('dautovic-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
    const metaTheme = document.getElementById('meta-theme-color');
    if (metaTheme) metaTheme.setAttribute('content', savedTheme === 'dark' ? '#121826' : '#ffffff');

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('dautovic-theme', next);
        if (metaTheme) metaTheme.setAttribute('content', next === 'dark' ? '#121826' : '#ffffff');
      });
    }

    // Scroll progress fallback for browsers without native scroll-timeline
    if (!CSS.supports('animation-timeline', 'scroll()')) {
      const prog = document.getElementById('reading-progress');
      window.addEventListener('scroll', () => {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        if (scrollable > 0 && prog) {
          prog.style.transform = `scaleX(${window.scrollY / scrollable})`;
        }
      }, { passive: true });
    }

    // Toast helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Article Loader
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        document.getElementById('article-loader').textContent = 'Article not specified.';
        return;
      }

      try {
        const listRes = await fetch('/data/posts.json');
        const posts = await listRes.json();
        const postIdx = posts.findIndex(p => p.slug === slug);
        
        if (postIdx !== -1) {
          const post = posts[postIdx];
          renderArticle(post, posts, postIdx);
        } else {
          document.getElementById('article-loader').textContent = 'Story not found.';
        }
      } catch (err) {
        document.getElementById('article-loader').textContent = 'Error loading article.';
      }
    }

    function renderArticle(post, allPosts, idx) {
      document.title = `${post.title} — Dautovic`;
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-cat').textContent = post.categories && post.categories[0] ? post.categories[0] : 'General';
      document.getElementById('post-readtime').textContent = post.readTime || '2 min read';
      
      const d = new Date(post.date.replace(' ', 'T'));
      document.getElementById('post-date').textContent = isNaN(d) ? post.date : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('post-body').innerHTML = post.content;

      // Next / Previous Story Links
      if (allPosts && allPosts.length > 0) {
        if (idx < allPosts.length - 1) {
          const older = allPosts[idx + 1];
          const prevLink = document.getElementById('prev-story-link');
          prevLink.href = '/post.html?slug=' + encodeURIComponent(older.slug);
          document.getElementById('prev-story-title').textContent = older.title;
          prevLink.style.display = 'flex';
        }
        if (idx > 0) {
          const newer = allPosts[idx - 1];
          const nextLink = document.getElementById('next-story-link');
          nextLink.href = '/post.html?slug=' + encodeURIComponent(newer.slug);
          document.getElementById('next-story-title').textContent = newer.title;
          nextLink.style.display = 'flex';
        }
      }

      document.getElementById('article-loader').style.display = 'none';
      document.getElementById('article-content').style.display = 'block';

      // Share button
      document.getElementById('share-btn').addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: post.title, url: window.location.href });
          } catch (e) {}
        } else {
          await navigator.clipboard.writeText(window.location.href);
          showToast('Link copied to clipboard ✓');
        }
      });
    }

    loadArticle();
  </script>
</body>
</html>
