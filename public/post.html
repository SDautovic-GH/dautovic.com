<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Dautovic</title>
  <link rel="icon" href="/assets/img/logo.jpg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-group">
        <a href="/" style="display:flex;align-items:center;gap:12px;">
          <img src="/assets/img/logo.jpg" alt="Dautovic Logo" class="brand-logo">
          <div class="brand-text">
            <h1>Dautovic</h1>
            <span class="brand-tagline">Learn every day.</span>
          </div>
        </a>
      </div>

      <nav class="site-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/archive.html" class="nav-link">Archive</a>
        <a href="/links.html" class="nav-link">Links</a>
        <a href="https://today.dautovic.com" class="today-pill-btn" target="_blank" rel="noopener">
          <span>Today</span>
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        </a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Article Container -->
  <main class="container" style="padding-top:20px;padding-bottom:60px;">
    <a href="/" class="back-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to all stories</span>
    </a>

    <div id="article-loader" style="text-align:center;padding:60px 0;color:var(--text-muted);">
      Loading article…
    </div>

    <article id="article-content" style="display:none;">
      <header class="article-header">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <span id="post-cat" class="card-cat"></span>
          <span style="color:var(--text-muted)">•</span>
          <span id="post-readtime" style="font-size:0.85rem;color:var(--text-muted)"></span>
        </div>
        <h1 id="post-title" class="article-title"></h1>
        <div class="article-meta">
          <span>By Samir Dautovic</span>
          <span>•</span>
          <time id="post-date"></time>
          <button id="share-btn" style="margin-left:auto;background:none;border:none;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:0.85rem;font-weight:600;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
            Share
          </button>
        </div>
      </header>

      <div id="post-body" class="article-body"></div>

      <div style="margin-top:48px;padding-top:24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;">
        <a href="/" class="read-link">← More articles</a>
        <a href="#top" class="read-link" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Back to top ↑</a>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/archive.html">Archive</a>
        <a href="/links.html">Links</a>
        <a href="/page.html?slug=about">About</a>
        <a href="/page.html?slug=contact-2">Contact</a>
        <a href="https://today.dautovic.com">Today Reader</a>
        <a href="/feed.xml">RSS Feed</a>
      </div>
      <p>© 2026 Samir Dautovic. Built on Cloudflare Pages.</p>
    </div>
  </footer>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('dautovic-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('dautovic-theme', next);
      });
    }

    // Article Loader
    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        document.getElementById('article-loader').textContent = 'Article not specified.';
        return;
      }

      try {
        let res;
        try {
          res = await fetch('/api/posts/' + encodeURIComponent(slug));
          if (!res.ok) throw new Error('API not available');
          const post = await res.json();
          renderArticle(post);
          return;
        } catch (e) {
          // Fall back to static JSON
          const listRes = await fetch('/data/posts.json');
          const posts = await listRes.json();
          const post = posts.find(p => p.slug === slug);
          if (post) {
            renderArticle(post);
          } else {
            document.getElementById('article-loader').textContent = 'Story not found.';
          }
        }
      } catch (err) {
        document.getElementById('article-loader').textContent = 'Error loading article.';
      }
    }

    function renderArticle(post) {
      document.title = `${post.title} — Dautovic`;
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-cat').textContent = post.categories && post.categories[0] ? post.categories[0] : 'General';
      document.getElementById('post-readtime').textContent = post.readTime || '2 min read';
      
      const d = new Date(post.date.replace(' ', 'T'));
      document.getElementById('post-date').textContent = isNaN(d) ? post.date : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('post-body').innerHTML = post.content;

      document.getElementById('article-loader').style.display = 'none';
      document.getElementById('article-content').style.display = 'block';

      // Share button
      document.getElementById('share-btn').addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: post.title, url: window.location.href });
          } catch (e) {}
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert('Link copied to clipboard!');
        }
      });
    }

    loadArticle();
  </script>
</body>
</html>
