<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin — Dautovic</title>
  <link rel="icon" href="/assets/img/logo.jpg">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* Admin Desk Specific Styles */
    .admin-wrap {
      max-width: 960px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }
    .admin-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .admin-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-outline {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: var(--bg-subtle);
    }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 116, 184, 0.15);
    }
    .editor-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .editor-textarea-wrap {
      width: 100%;
    }
    .preview-wrap {
      width: 100%;
    }
    .preview-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      background: var(--bg-surface);
      min-height: 160px;
      max-height: none;
    }
    .post-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    .post-table th, .post-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .post-table th {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-published {
      background: #dcfce7;
      color: #166534;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-draft {
      background: #fef9c3;
      color: #854d0e;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-group">
        <a href="/" style="display:flex;align-items:center;gap:12px;">
          <img src="/assets/img/logo.jpg" alt="Dautovic Logo" class="brand-logo">
          <div class="brand-text">
            <h1>Dautovic</h1>
            <span class="brand-tagline">CMS Admin Desk</span>
          </div>
        </a>
      </div>

      <nav class="site-nav">
        <a href="/" class="nav-link" target="_blank">View Site ↗</a>
        <a href="https://today.dautovic.com" class="today-pill-btn" target="_blank" rel="noopener">Today</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <div class="admin-wrap">
    <!-- Auth Screen -->
    <div id="auth-view" class="admin-card" style="max-width:400px;margin:60px auto;">
      <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:8px;text-align:center;">Admin Login</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;text-align:center;margin-bottom:20px;">Enter your admin passcode to access your CMS.</p>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Passcode</label>
          <input type="password" id="passcode-input" class="form-input" placeholder="••••••••" required autofocus>
        </div>
        <button type="submit" class="admin-btn btn-primary" style="width:100%;justify-content:center;">Unlock Writing Desk</button>
      </form>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-view" style="display:none;">
      <div class="admin-card">
        <div class="admin-header">
          <div>
            <h2 style="font-size:1.5rem;font-weight:700;">Stories & Drafts</h2>
            <p style="color:var(--text-muted);font-size:0.85rem;" id="stats-summary"></p>
          </div>
          <button id="new-post-btn" class="admin-btn btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Write New Story
          </button>
        </div>

        <input type="text" id="admin-search" class="form-input" placeholder="Search posts to edit…" style="margin-bottom:16px;">

        <div style="overflow-x:auto;">
          <table class="post-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Status</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-posts-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Editor Screen -->
    <div id="editor-view" style="display:none;">
      <div class="admin-card">
        <div class="admin-header">
          <h2 id="editor-heading" style="font-size:1.5rem;font-weight:700;">Edit Story</h2>
          <div style="display:flex;gap:8px;">
            <button id="cancel-edit-btn" class="admin-btn btn-outline">Cancel</button>
            <button id="save-draft-btn" class="admin-btn btn-outline">Save Draft</button>
            <button id="publish-btn" class="admin-btn btn-primary">Publish</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" id="post-title-input" class="form-input" placeholder="Enter headline…" required>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label class="form-label">Slug (URL)</label>
            <input type="text" id="post-slug-input" class="form-input" placeholder="url-friendly-slug">
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input type="text" id="post-cat-input" class="form-input" placeholder="e.g. Technology, Podcasts, Career">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Summary / Excerpt</label>
          <textarea id="post-excerpt-input" class="form-textarea" rows="2" placeholder="Brief summary of the article…"></textarea>
        </div>

        <!-- Full-Width Content Editor with Toolbar & Preview Below -->
        <div class="form-group">
          <label class="form-label">Story Content (Markdown & HTML supported)</label>
          <div class="editor-layout">
            <div class="editor-textarea-wrap">
              <div class="editor-toolbar">
                <button type="button" class="toolbar-btn" data-action="title" title="Title (H1)"><b>H1</b></button>
                <button type="button" class="toolbar-btn" data-action="heading" title="Heading (H2)">H2</button>
                <button type="button" class="toolbar-btn" data-action="subheading" title="Subheading (H3)">H3</button>
                <span class="toolbar-divider"></span>
                <button type="button" class="toolbar-btn" data-action="bold" title="Bold"><b>B</b></button>
                <button type="button" class="toolbar-btn" data-action="italic" title="Italic"><i>I</i></button>
                <button type="button" class="toolbar-btn" data-action="strike" title="Strikethrough"><s>S</s></button>
                <span class="toolbar-divider"></span>
                <button type="button" class="toolbar-btn" data-action="bullet" title="Bullet List">• List</button>
                <button type="button" class="toolbar-btn" data-action="number" title="Numbered List">1. List</button>
                <button type="button" class="toolbar-btn" data-action="quote" title="Quote">“ ”</button>
                <span class="toolbar-divider"></span>
                <button type="button" class="toolbar-btn" data-action="divider" title="Horizontal Divider">— Divider</button>
                <button type="button" class="toolbar-btn" data-action="code" title="Code / Monospace">&lt;/&gt; Code</button>
                <button type="button" class="toolbar-btn" data-action="newline" title="Line Break">&para; Break</button>
                <span class="toolbar-divider"></span>
                <button type="button" class="toolbar-btn" data-action="link" title="Add / Edit Link">🔗 Link</button>
                <label class="toolbar-btn file-btn" title="Upload Image from computer">
                  📷 Image
                  <input type="file" id="image-upload-input" accept="image/*" style="display:none;">
                </label>
              </div>
              <textarea id="post-content-input" class="form-textarea" rows="15" placeholder="Write your story here…" style="font-family:monospace;font-size:0.95rem;width:100%;border-radius:0;"></textarea>
              <div class="editor-status-bar">
                <span>Markdown & HTML supported</span>
                <span id="word-count-badge">0 words • 1 min read</span>
              </div>
            </div>

            <!-- Full-Width Live Preview Below -->
            <div class="preview-wrap">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                <span style="font-size:0.85rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Live Story Preview</span>
                <span style="font-size:0.78rem;color:var(--text-light);">Updates in real time</span>
              </div>
              <div id="preview-output" class="preview-box article-body"></div>
            </div>
          </div>
        </div>

        <div id="delete-zone" style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;">
          <button id="delete-post-btn" class="admin-btn btn-danger">Delete Story</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/admin.js"></script>
</body>
</html>
